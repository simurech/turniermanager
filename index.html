<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Turnier Manager</title>
    <meta name="description" content="Das jährliche Fussball-Turnier: Spielplan, Tabelle, K.O.-Runde, Wettquoten und Archiv." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1d2b53" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Turnier Manager" />
    <meta property="og:description" content="Das jährliche Fussball-Turnier: Spielplan, Tabelle, K.O.-Runde, Wettquoten und Archiv." />
    <meta property="og:image" content="https://turniermanager.urech.dev/android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      /* Startanzeige: erscheint sofort, noch bevor das Programm geladen ist */
      html { background: #cdbf9a; }
      body { margin: 0; background: #f2e8cf; color: #1d2b53; }
      .boot { max-width: 520px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 16px 0; }
      .boot b { display: block; width: 62%; height: 32px; border-radius: 4px; background: #c8372d; box-shadow: 3px 3px 0 #1d2b53; }
      .boot i { display: block; margin-top: 28px; height: 72px; border: 2.5px solid #1d2b53; border-radius: 6px; background: linear-gradient(90deg, #e9dcba, #fffaf0, #e9dcba) 0 0 / 200% 100%; animation: boot 1.2s infinite; }
      @keyframes boot { to { background-position: -200% 0; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-busy="true" aria-label="Lädt"><b></b><i></i><i></i></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
